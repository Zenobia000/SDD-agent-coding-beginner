exclude_docs = "instructor/"
extra_css = ["assets/site/course.css"]
extra_javascript = ["assets/site/course.js"]
repo_url = "https://github.com/Zenobia000/SDD-agent-coding-beginner"
edit_uri = "edit/main/curriculum/"
site_dir = "site"
site_name = "SDD × AI 開發實戰營"
