    { "總覽" = "1-bootcamp/README.md" },
    { "D1｜規格" = "1-bootcamp/DAY1.md" },
    { "D2｜從 0 到 1" = "1-bootcamp/DAY2.md" },
  ] },
  { "工具箱" = [
    { "總覽" = "3-playbook/README.md" },
    { "Prompt 魔法書" = "3-playbook/PROMPT-BOOK.md" },
    { "問題排解" = "3-playbook/TROUBLESHOOTING.md" },
    { "防呆檢核表" = "3-playbook/CHECKLIST.md" },
    { "導入評估表" = "3-playbook/ASSESSMENT.md" },
  ] },
  { "企業系統案例" = [
    { "總覽" = "4-casebook/README.md" },
    { "差勤" = "4-casebook/attendance.md" },
    { "請款" = "4-casebook/expense-claim.md" },
    { "庫存" = "4-casebook/inventory.md" },
    { "活動成效看板" = "4-casebook/marketing-dashboard.md" },
    { "報價單" = "4-casebook/quotation.md" },
    { "客服工單" = "4-casebook/support-ticket.md" },
    { "供應商比價" = "4-casebook/vendor-comparison.md" },
  ] },
  { "進階：CookCard" = [
    { "總覽" = "advanced/cookcard/README.md" },
    { "心法" = "advanced/cookcard/PRINCIPLES.md" },
    { "七站" = "advanced/cookcard/BUILD.md" },
    { "指令與提示詞" = "advanced/cookcard/COOKBOOK.md" },
    { "Fixture 挑選準則" = "advanced/cookcard/FIXTURES.md" },
    { "技能速查" = "advanced/cookcard/SKILL-MAP.md" },
  ] },
  { "開場投影片" = [
    { "總覽" = "slides/README.md" },
    { "視覺規範" = "slides/STYLE.md" },
    { "吉祥物" = "slides/MASCOT.md" },
  ] },
