{{CSS}}

<body class="deck">
{{SLIDES}}
<script>
// 左右鍵或空白鍵換頁；列印時每頁一張 16:9
const slides = [...document.querySelectorAll(".slide")];
const current = () => Math.max(0, slides.findIndex((s) => s.getBoundingClientRect().bottom > window.innerHeight / 2));
document.addEventListener("keydown", (e) => {
  const step = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, " ": 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1 }[e.key];
  if (!step) return;
  e.preventDefault();
  slides[Math.min(slides.length - 1, Math.max(0, current() + step))].scrollIntoView({ behavior: "smooth" });
});
document.querySelectorAll(".slide table").forEach((t) => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });
</script>
</body>
</html>
