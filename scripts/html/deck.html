<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}｜高層簡報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
{{CSS}}
</style>
</head>
<body class="deck">
<a class="skip-link" href="#deck-content">跳到簡報內容</a>
<header class="deck-header">
  <a href="starter-kit.html">企業 AI 轉型啟動指南</a>
  <button class="deck-view" type="button" hidden>完整瀏覽</button>
  <button class="deck-print" type="button" hidden>列印</button>
</header>
<main class="deck-stage" id="deck-content" tabindex="-1">
{{SLIDES}}
</main>
<nav class="deck-controls" aria-label="簡報頁面" hidden>
  <button class="deck-prev" type="button" aria-label="上一頁">←</button>
  <label class="deck-jump">跳至頁面<select aria-label="選擇簡報頁面">{{SLIDE_NAV}}</select></label>
  <span class="deck-position" aria-live="polite"></span>
  <button class="deck-next" type="button" aria-label="下一頁">→</button>
</nav>
<script>
{{JS}}
</script>
</body>
</html>
