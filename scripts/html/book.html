<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}｜{{SUBTITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
{{CSS}}
</style>
</head>
<body data-book="{{BOOK}}">
<a class="skip-link" href="#reading-content">跳到內容</a>
<header class="topbar">
  <button class="menu" type="button" aria-controls="book-toc" aria-expanded="false">目錄</button>
  <span class="topbar__brand">SUNNY DATA SCIENCE</span>
  <span class="topbar__title">{{TITLE}}</span>
  <span class="topbar__progress" hidden></span>
  {{READER_TOOLS}}
</header>
<nav class="toc" id="book-toc" aria-label="目錄">
  <a class="toc__cover" href="#cover">{{TITLE}}</a>
  {{NAV}}
</nav>
<main id="reading-content" tabindex="-1">
  <section class="cover" id="cover">
    <p class="cover__brand">{{BRAND}}</p>
    <div>
      <h1 class="cover__title">{{TITLE}}</h1>
      <p class="cover__subtitle">{{SUBTITLE}}</p>
      {{COVER_ACTIONS}}
    </div>
    <p class="cover__note">{{COVER_NOTE}}</p>
  </section>
  {{READER_BAR}}
  {{CONTENT}}
  <footer class="colophon">© 桑尼資料科學 Sunny Data Science</footer>
</main>
<script type="module">
{{JS}}
</script>
</body>
</html>
