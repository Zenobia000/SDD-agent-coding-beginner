<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataView — 六種狀態</title>
<link rel="stylesheet" href="./src/data-view.css">
<style>
  body { max-width: 42rem; margin: 2rem auto; padding: 0 1rem;
         font: 1rem/1.6 system-ui, "Noto Sans TC", sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
  .bar button { min-height: 44px; padding: .5rem 1rem; cursor: pointer;
                border: 1px solid #1a5490; border-radius: 6px;
                background: #fff; color: #1a5490; font: inherit; }
  .bar button:focus-visible { outline: 3px solid #1a5490; outline-offset: 2px; }
  .state { margin-top: 1rem; color: #595959; font-size: .875rem; }
  code { background: #f4f4f4; padding: .1rem .3rem; border-radius: 3px; }
</style>
</head>
<body>

<h1>DataView — 六種狀態</h1>
<p>設計稿只畫 Success 那一格。其他五格是你的責任，而且使用者更常遇到。
每個按鈕切換一種狀態，用鍵盤 Tab 也能操作。</p>

<div class="bar">
  <button data-demo="success">Success</button>
  <button data-demo="loading">Loading（慢 1.5 秒）</button>
  <button data-demo="fast">Loading（快 100ms，不該閃）</button>
  <button data-demo="empty">Empty</button>
  <button data-demo="error">Error</button>
  <button data-demo="partial">Partial</button>
  <button data-demo="forbidden">Forbidden</button>
  <button data-demo="xss">XSS 嘗試（應被跳脫）</button>
</div>

<data-view id="view" empty-message="還沒有任何匯率紀錄" empty-action="#new"></data-view>
<p class="state">目前狀態：<code id="cur">—</code></p>

<script type="module">
import './src/data-view.js';

const view = document.getElementById('view');
const cur  = document.getElementById('cur');
view.addEventListener('statechange', e => { cur.textContent = e.detail.state; });

const wait = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));

const demos = {
  success:  () => wait(200, { items: [
    { label: '美元 USD', value: '31.2450' },
    { label: '日圓 JPY', value: '0.2043' },
    { label: '歐元 EUR', value: '33.8710' },
  ]}),
  loading:  () => wait(1500, { items: [{ label: '美元 USD', value: '31.2450' }] }),
  fast:     () => wait(100,  { items: [{ label: '美元 USD', value: '31.2450' }] }),
  empty:    () => wait(200, { items: [] }),
  error:    () => wait(200).then(() => { throw new Error('連線逾時'); }),
  partial:  () => wait(200, { items: [
    { label: '美元 USD', value: '31.2450' },
    { label: '日圓 JPY', value: '0.2043' },
  ], hasMore: true }),
  forbidden:() => wait(200, { forbidden: true }),
  xss:      () => wait(200, { items: [
    { label: '<img src=x onerror="alert(1)">', value: '<script>alert(2)<\/script>' },
  ]}),
};

document.querySelectorAll('[data-demo]').forEach(btn => {
  btn.addEventListener('click', () => view.load(demos[btn.dataset.demo]));
});

view.load(demos.success);
</script>

<hr style="margin:2rem 0">
<h2>自我檢查</h2>
<ul>
  <li>按「Loading（快 100ms）」→ <strong>不該看到骨架屏閃一下</strong>（延遲 300ms 才顯示）</li>
  <li>按「Error」→ 有 ⚠️ 圖示 + 文字 + 可點的重試鈕（<strong>不只是變紅</strong>）</li>
  <li>按「XSS 嘗試」→ 應該看到跳脫後的原始字串，<strong>不該跳出 alert</strong></li>
  <li>用 Tab 鍵走一遍 → 每個焦點都有藍色外框</li>
  <li>把視窗縮到 640px 以下 → 每一列變成上下排列</li>
</ul>

</body>
</html>
