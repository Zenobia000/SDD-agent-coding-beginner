<svg xmlns="http://www.w3.org/2000/svg" width="980" height="396" viewBox="0 0 980 396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <title>Luca's Skills 工具箱：元技能</title>
  <desc>不在主流程線上的元技能：動工對象是代理與文件本身，不是你的 codebase。writing-for-agents 與 wizard 為模型觸發，wait-what 與 to-questionnaire 為使用者觸發，management-frameworks、writing-hooks、diagram 與 svg-palette 仍在 draft 試用。</desc>

  <defs>
    <style>
      .box  { stroke-width: 1.5; }
      .user { fill: #ddf4ff; stroke: #0969da; }
      .model{ fill: #fbefff; stroke: #8250df; }
      .draft{ stroke-dasharray: 5 3; }
      .skill{ font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 15px; fill: #1f2328; }
      .sub  { font-size: 11.5px; fill: #57606a; }
      .note { font-size: 11.5px; fill: #57606a; }
    </style>
  </defs>

  <rect width="980" height="396" fill="#ffffff"/>

  <!-- header -->
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1f2328">工具箱：對代理與文件動工的元技能</text>
  <text x="24" y="54" class="note">主流程（上圖）動的是你的 codebase；這裡動的是代理、技能與文件本身。</text>
  <rect x="800" y="22" width="14" height="14" rx="3" class="box user"/>
  <text x="822" y="34" class="note">使用者觸發</text>
  <rect x="800" y="42" width="14" height="14" rx="3" class="box model"/>
  <text x="822" y="54" class="note">模型觸發</text>
  <rect x="800" y="62" width="14" height="14" rx="3" class="box user draft"/>
  <text x="822" y="74" class="note">虛線框 = draft，試用中</text>

  <!-- cards -->
  <rect x="24" y="88" width="454" height="64" rx="8" class="box model"/>
  <text x="251" y="114" text-anchor="middle" class="skill">/writing-for-agents</text>
  <text x="251" y="136" text-anchor="middle" class="sub">寫或改技能、AGENTS.md、CLAUDE.md 之前，先載入這個</text>

  <rect x="502" y="88" width="454" height="64" rx="8" class="box model"/>
  <text x="729" y="114" text-anchor="middle" class="skill">/wizard</text>
  <text x="729" y="136" text-anchor="middle" class="sub">撞上只有人能做的步驟 — 開通、憑證、CI secrets、第三方後台</text>

  <rect x="24" y="164" width="454" height="64" rx="8" class="box user"/>
  <text x="251" y="190" text-anchor="middle" class="skill">/wait-what</text>
  <text x="251" y="212" text-anchor="middle" class="sub">代理講了一段沒讓你聽懂 — 停下來，要求重講一次</text>

  <rect x="502" y="164" width="454" height="64" rx="8" class="box user"/>
  <text x="729" y="190" text-anchor="middle" class="skill">/to-questionnaire</text>
  <text x="729" y="212" text-anchor="middle" class="sub">這個決策你答不了 — 做成問卷，交給掌握答案的人填</text>

  <rect x="24" y="240" width="454" height="64" rx="8" class="box model draft"/>
  <text x="251" y="266" text-anchor="middle" class="skill">/management-frameworks</text>
  <text x="251" y="288" text-anchor="middle" class="sub">管理難題不知從何拆起 — 從約 60 個框架裡挑一個給你</text>

  <rect x="502" y="240" width="454" height="64" rx="8" class="box model draft"/>
  <text x="729" y="266" text-anchor="middle" class="skill">/writing-hooks</text>
  <text x="729" y="288" text-anchor="middle" class="sub">要新增 hook、或 hook 沒擋住該擋的 — 判準、沉默紀律、防腐爛</text>

  <rect x="24" y="316" width="454" height="64" rx="8" class="box model draft"/>
  <text x="251" y="342" text-anchor="middle" class="skill">/diagram</text>
  <text x="251" y="364" text-anchor="middle" class="sub">會報、標案、工程文件需要圖 — 依受眾挑圖並繪製，缺資訊先給草稿再問</text>

  <rect x="502" y="316" width="454" height="64" rx="8" class="box model draft"/>
  <text x="729" y="342" text-anchor="middle" class="skill">/svg-palette</text>
  <text x="729" y="364" text-anchor="middle" class="sub">畫 SVG 的色盤與用色規則 — 靛青深淺＋橘強調，CI 色可覆蓋</text>
</svg>
