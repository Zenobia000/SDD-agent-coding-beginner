<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1194" viewBox="0 0 980 1194" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <title>Luca's Skills 藍圖：想法 → 出貨</title>
  <desc>主流程藍圖，實線框為 core 技能，虛線框為試用中的 draft：feasibility、to-architecture 與 frontend-spec 在切開階段可選，implement-all 批次派工，test-blueprint 提案測試藍圖並指派各層，uat-cases 產出凍結編號的驗收案例清單，browser-evidence 在收尾後留驗收證據，refactor 與 git-merge 隨時可用。元技能見 toolbox.svg。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
    <style>
      .box  { stroke-width: 1.5; }
      .user { fill: #ddf4ff; stroke: #0969da; }
      .model{ fill: #fbefff; stroke: #8250df; }
      .draft{ stroke-dasharray: 5 3; }
      .skill{ font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 15px; fill: #1f2328; }
      .skill-sm { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; fill: #1f2328; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1f2328; }
      .sub  { font-size: 11.5px; fill: #57606a; }
      .band-label { font-size: 12px; fill: #57606a; letter-spacing: 0.5px; }
      .band-name  { font-size: 14px; fill: #1f2328; font-weight: 600; }
      .edge { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .edge-label { font-size: 11.5px; fill: #57606a; }
      .panel-title { font-size: 13px; fill: #1f2328; font-weight: 600; }
      .note { font-size: 11.5px; fill: #57606a; }
    </style>
  </defs>

  <rect width="980" height="1194" fill="#ffffff"/>

  <!-- header -->
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1f2328">主流程：想法 → 出貨</text>
  <text x="24" y="54" class="note">不確定用哪個？先打 /ask-luca。藍 = 你打字才會動，紫 = AI 也會自己用。</text>
  <rect x="800" y="22" width="14" height="14" rx="3" class="box user"/>
  <text x="822" y="34" class="note">使用者觸發</text>
  <rect x="800" y="42" width="14" height="14" rx="3" class="box model"/>
  <text x="822" y="54" class="note">模型觸發</text>
  <rect x="800" y="62" width="14" height="14" rx="3" class="box user draft"/>
  <text x="822" y="74" class="note">虛線框 = draft，試用中</text>

  <!-- stage bands -->
  <rect x="24" y="70"  width="516" height="64"  rx="10" fill="#f6f8fa"/>
  <rect x="24" y="142" width="516" height="150" rx="10" fill="#f6f8fa"/>
  <rect x="24" y="300" width="516" height="310" rx="10" fill="#f6f8fa"/>
  <rect x="24" y="618" width="516" height="110" rx="10" fill="#f6f8fa"/>
  <rect x="24" y="736" width="516" height="168" rx="10" fill="#f6f8fa"/>

  <!-- stage labels -->
  <text x="230" y="96"  text-anchor="end" class="band-label">階段 0</text>
  <text x="230" y="116" text-anchor="end" class="band-name">前置</text>
  <text x="230" y="176" text-anchor="end" class="band-label">階段 1</text>
  <text x="230" y="196" text-anchor="end" class="band-name">想清楚</text>
  <text x="212" y="442" text-anchor="end" class="band-label">階段 2</text>
  <text x="212" y="462" text-anchor="end" class="band-name">切開</text>
  <text x="230" y="666" text-anchor="end" class="band-label">階段 3</text>
  <text x="230" y="686" text-anchor="end" class="band-name">建置</text>
  <text x="230" y="812" text-anchor="end" class="band-label">階段 4</text>
  <text x="230" y="832" text-anchor="end" class="band-name">收尾</text>

  <!-- 0. setup-skills -->
  <rect x="250" y="80" width="230" height="44" rx="8" class="box user"/>
  <text x="365" y="100" text-anchor="middle" class="skill">/setup-skills</text>
  <text x="365" y="116" text-anchor="middle" class="sub">每個 repo 一次：追蹤器、文件、協作模式</text>
  <path d="M 365 124 L 365 156" class="edge"/>

  <!-- 1. grill-with-docs -->
  <rect x="250" y="160" width="230" height="44" rx="8" class="box user"/>
  <text x="365" y="180" text-anchor="middle" class="skill">/grill-with-docs</text>
  <text x="365" y="196" text-anchor="middle" class="sub">一問一答磨利想法，定了案才寫檔</text>

  <!-- detour out / back -->
  <path d="M 480 176 L 556 176" class="edge"/>
  <path d="M 560 225 L 440 225 L 440 232" class="edge"/>

  <!-- decision -->
  <rect x="225" y="236" width="280" height="46" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="365" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">這次要做的，一個 session 做得完嗎？</text>

  <path d="M 365 282 L 365 316" class="edge"/>
  <text x="376" y="304" class="edge-label">做不完 — 先切開</text>

  <path d="M 505 259 L 530 259 L 530 669 L 484 669" class="edge"/>
  <text x="538" y="614" class="edge-label">做得完 — 直接開工</text>

  <!-- 2. to-spec / optional drafts / to-tickets -->
  <rect x="250" y="320" width="230" height="44" rx="8" class="box user"/>
  <text x="365" y="340" text-anchor="middle" class="skill">/to-spec</text>
  <text x="365" y="356" text-anchor="middle" class="sub">把結論寫成規格，發進議題追蹤器</text>
  <path d="M 365 364 L 365 380" class="edge"/>

  <rect x="250" y="380" width="230" height="38" rx="8" class="box user draft"/>
  <text x="365" y="397" text-anchor="middle" class="skill-sm">/feasibility</text>
  <text x="365" y="412" text-anchor="middle" class="sub">四問一判決（✅／⚠️／❌），掛回 spec issue</text>
  <text x="244" y="403" text-anchor="end" class="edge-label">可選</text>
  <path d="M 365 418 L 365 434" class="edge"/>

  <rect x="250" y="434" width="230" height="38" rx="8" class="box user draft"/>
  <text x="365" y="451" text-anchor="middle" class="skill-sm">/to-architecture</text>
  <text x="365" y="466" text-anchor="middle" class="sub">技術棧、資料模型、API 合約；出貨即刪</text>
  <text x="244" y="457" text-anchor="end" class="edge-label">可選</text>
  <path d="M 365 472 L 365 488" class="edge"/>

  <rect x="250" y="488" width="230" height="38" rx="8" class="box user draft"/>
  <text x="365" y="505" text-anchor="middle" class="skill-sm">/frontend-spec</text>
  <text x="365" y="520" text-anchor="middle" class="sub">路由、四態畫面、Pencil 稿；出貨即刪</text>
  <text x="244" y="511" text-anchor="end" class="edge-label">可選</text>
  <path d="M 365 526 L 365 542" class="edge"/>

  <rect x="250" y="542" width="230" height="44" rx="8" class="box user"/>
  <text x="365" y="562" text-anchor="middle" class="skill">/to-tickets</text>
  <text x="365" y="578" text-anchor="middle" class="sub">切成小票，每張一個 session 做得完</text>
  <path d="M 365 586 L 365 636" class="edge"/>
  <text x="376" y="616" class="edge-label">先 /clear</text>

  <!-- test-blueprint: proposes layer layout, seam list, CI tiers -->
  <rect x="724" y="452" width="220" height="68" rx="8" class="box user draft"/>
  <text x="834" y="474" text-anchor="middle" class="skill-sm">/test-blueprint</text>
  <text x="834" y="492" text-anchor="middle" class="sub">提案層佈局、縫清單（供 /tdd）、CI 時段</text>
  <text x="834" y="507" text-anchor="middle" class="sub">核准才落檔；產檢查腳本、CI 與現況報告</text>
  <path d="M 834 520 L 834 552" class="edge"/>
  <text x="842" y="542" class="edge-label">指派驗收層</text>

  <!-- uat-cases: derives the case list browser-evidence executes -->
  <rect x="724" y="556" width="220" height="54" rx="8" class="box user draft"/>
  <text x="834" y="578" text-anchor="middle" class="skill-sm">/uat-cases</text>
  <text x="834" y="596" text-anchor="middle" class="sub">從 spec／user story 推導案例；TC 編號一發即凍結</text>
  <path d="M 890 610 L 890 736" class="edge"/>
  <text x="898" y="680" class="edge-label">清單</text>

  <!-- 3. implement + implement-all -->
  <rect x="250" y="640" width="230" height="72" rx="8" class="box user"/>
  <text x="365" y="664" text-anchor="middle" class="skill">/implement</text>
  <text x="365" y="682" text-anchor="middle" class="sub">一個 session 做一張票</text>
  <text x="365" y="698" text-anchor="middle" class="sub">會自動跑 /tdd 與 /code-review</text>
  <path d="M 365 712 L 365 740" class="edge"/>

  <rect x="560" y="640" width="270" height="72" rx="8" class="box user draft"/>
  <text x="695" y="664" text-anchor="middle" class="skill-sm">/implement-all</text>
  <text x="695" y="682" text-anchor="middle" class="sub">票多時一次派完：每票一個子代理跑 /implement</text>
  <text x="695" y="698" text-anchor="middle" class="sub">排程你點頭才派；合併還是你按</text>
  <path d="M 560 676 L 484 676" class="edge"/>

  <!-- 4. close out -->
  <rect x="250" y="744" width="230" height="40" rx="8" class="box model"/>
  <text x="365" y="761" text-anchor="middle" class="skill-sm">/code-review</text>
  <text x="365" y="776" text-anchor="middle" class="sub">/implement 收尾自動跑，通過才 commit</text>
  <path d="M 365 784 L 365 800" class="edge"/>

  <rect x="560" y="740" width="384" height="68" rx="8" class="box user draft"/>
  <text x="752" y="762" text-anchor="middle" class="skill-sm">/browser-evidence</text>
  <text x="752" y="780" text-anchor="middle" class="sub">驗收證據要交給別人時才跑：截圖、網路紀錄、被測版本</text>
  <text x="752" y="796" text-anchor="middle" class="sub">清單來自 /uat-cases 或外部；判定不歸它管；證據 PR 合回基底分支</text>
  <path d="M 484 764 L 556 764" class="edge"/>
  <text x="520" y="758" text-anchor="middle" class="edge-label">可選</text>

  <rect x="250" y="800" width="230" height="40" rx="8" class="box user"/>
  <text x="365" y="817" text-anchor="middle" class="skill-sm">/git-commit</text>
  <text x="365" y="832" text-anchor="middle" class="sub">只 commit 你 stage 的，英文訊息，推上遠端</text>
  <path d="M 365 840 L 365 860" class="edge"/>
  <text x="376" y="854" class="edge-label">票全部做完</text>

  <rect x="250" y="860" width="230" height="40" rx="8" class="box user"/>
  <text x="365" y="877" text-anchor="middle" class="skill-sm">/git-pr</text>
  <text x="365" y="892" text-anchor="middle" class="sub">開 PR；你按 merge 後再跑一次清分支</text>

  <!-- ticket loop -->
  <path d="M 250 820 L 240 820 L 240 676 L 246 676" class="edge"/>
  <text x="232" y="854" text-anchor="end" class="edge-label">還有票 → /clear，開下一張</text>

  <!-- ship + release -->
  <path d="M 480 880 L 560 880" class="edge"/>
  <text x="520" y="874" text-anchor="middle" class="edge-label">merge 是你按</text>
  <rect x="560" y="860" width="130" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="625" y="885" text-anchor="middle" class="skill-sm">PR 合併，出貨</text>
  <path d="M 690 880 L 724 880" class="edge"/>
  <text x="707" y="874" text-anchor="middle" class="edge-label">可選</text>
  <rect x="724" y="860" width="200" height="40" rx="8" class="box user"/>
  <text x="824" y="877" text-anchor="middle" class="skill-sm">/git-release</text>
  <text x="824" y="892" text-anchor="middle" class="sub">要發版才跑：版號、摘要、tag</text>

  <!-- detour panel -->
  <rect x="560" y="146" width="384" height="142" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="576" y="166" class="panel-title">繞道：要跑起來才能回答的問題</text>
  <text x="576" y="182" class="note">狀態模型、商業邏輯、非看不可的 UI</text>
  <text x="576" y="206" class="note">1. 跑 <tspan class="mono">/handoff</tspan>，它會印出一個文件路徑</text>
  <text x="576" y="226" class="note">2. 開新 session，第一句貼上路徑，跑 <tspan class="mono">/prototype</tspan></text>
  <text x="576" y="246" class="note">3. 答案到手，再跑 <tspan class="mono">/handoff</tspan> 拿新路徑</text>
  <text x="576" y="266" class="note">4. 再開新 session，貼上路徑，回到主流程</text>

  <!-- session rules -->
  <rect x="560" y="300" width="384" height="88" rx="10" fill="#f6f8fa"/>
  <text x="576" y="322" class="panel-title">session 規則</text>
  <text x="576" y="342" class="note">階段 1 到 2 同一個 session 一路做完，中間不 /clear。</text>
  <text x="576" y="359" class="note">/to-tickets 之後，每張票各開一個新 session。</text>
  <text x="576" y="376" class="note">session 快滿了 → /handoff，開新 session 貼路徑接著做。</text>

  <!-- on-ramps -->
  <rect x="24" y="920" width="920" height="150" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="946" class="panel-title">交流道：從外面匯進主流程</text>

  <rect x="44" y="958" width="196" height="26" rx="8" class="box user"/>
  <text x="142" y="976" text-anchor="middle" class="skill-sm">/triage</text>
  <path d="M 248 971 L 288 971" class="edge"/>
  <text x="296" y="969" class="note">匯入 /implement</text>
  <text x="296" y="984" class="note">別人回報的 bug 與需求。自己用 /to-tickets 開的票直接 /implement。</text>

  <rect x="44" y="992" width="196" height="26" rx="8" class="box model"/>
  <text x="142" y="1010" text-anchor="middle" class="skill-sm">/diagnosing-bugs</text>
  <path d="M 248 1005 L 636 1005" class="edge"/>
  <text x="296" y="1018" class="note">難修的 bug。修完發現病根在架構，才走這條。</text>

  <rect x="644" y="992" width="280" height="26" rx="8" class="box user"/>
  <text x="784" y="1010" text-anchor="middle" class="skill-sm">/improve-codebase-architecture</text>

  <rect x="44" y="1026" width="196" height="26" rx="8" class="box user"/>
  <text x="142" y="1044" text-anchor="middle" class="skill-sm">/wayfinder</text>
  <path d="M 248 1039 L 288 1039" class="edge"/>
  <text x="296" y="1037" class="note">匯入 /to-spec</text>
  <text x="296" y="1052" class="note">題目大到不知從何下手。出來後接 /to-spec，不能直接跳 /implement。</text>

  <!-- development loop -->
  <path d="M 924 880 L 952 880" class="edge" style="marker-end:none" stroke-dasharray="6 4"/>
  <path d="M 924 1005 L 952 1005" class="edge" style="marker-end:none" stroke-dasharray="6 4"/>
  <path d="M 952 1005 L 952 138 L 390 138 L 390 156" class="edge" stroke-dasharray="6 4"/>
  <text x="612" y="132" class="edge-label">回到階段 1，換下一個想法</text>

  <!-- anytime layer -->
  <rect x="24" y="1086" width="920" height="84" rx="10" fill="#f6f8fa"/>
  <text x="44" y="1110" class="panel-title">隨時可用：不在流程線上，需要就叫</text>
  <text x="44" y="1134" class="skill-sm">/domain-modeling</text>
  <text x="180" y="1134" class="note">術語模糊、一詞多義；夠格的決策才立 ADR</text>
  <text x="470" y="1134" class="skill-sm">/grilling</text>
  <text x="550" y="1134" class="note">一問一答的基本功；還沒有 codebase 時用這個</text>
  <rect x="40" y="1142" width="96" height="22" rx="6" class="box model draft"/>
  <text x="88" y="1157" text-anchor="middle" class="skill-sm">/refactor</text>
  <text x="180" y="1157" class="note">不改可觀察行為的結構重整</text>
  <rect x="460" y="1142" width="106" height="22" rx="6" class="box user draft"/>
  <text x="513" y="1157" text-anchor="middle" class="skill-sm">/git-merge</text>
  <text x="580" y="1157" class="note">把分支併進來；衝突停下來，解法你決定</text>
</svg>
