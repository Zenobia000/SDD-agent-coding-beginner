description = "依 Conventional Commits 格式幫我寫 commit message（不直接 commit，等我確認）"
prompt = """
以下是目前 staged 的 git diff：

```
!{git diff --staged}
```

使用者額外提示：{{args}}

請：

1. 依 Conventional Commits 格式產生 commit subject（< 72 字元，用祈使句）
   - 可用 type：feat / fix / refactor / docs / test / chore / perf / ci
   - 格式：`<type>(<scope>): <subject>`
2. body 用 3 行內說明 **WHY**（為什麼要這個改動，不要重複描述 diff）
3. 如果偵測到 breaking change，加 `BREAKING CHANGE: <說明>` footer
4. **不要直接執行 `git commit`**，把完整 message 印出來等我確認

如果 staged diff 是空的，告訴我「沒有 staged 變更，請先 git add」就好，不要硬寫 message。
"""
